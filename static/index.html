<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coding Trainer</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fafafa; --panel: #fff; --text: #1d1d1f; --muted: #666; --border: #ddd; --input-border: #ccc;
    --hover: #f0f0f0; --active: #e3eefb; --code-bg: #f0f0f0; --accent: #0a66c2; --disabled: #999;
    --dot: #ddd; --ok: #2e9e44; --tab-bg: #1d1d1f; --tab-fg: #fff; --result-bg: #1d1d1f;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #16181c; --panel: #1e2126; --text: #e6e6e6; --muted: #9aa0a6; --border: #33373d; --input-border: #444a52;
    --hover: #2a2e34; --active: #1f3550; --code-bg: #2a2e34; --accent: #2f7de1; --disabled: #555;
    --dot: #444a52; --ok: #3fb950; --tab-bg: #e6e6e6; --tab-fg: #16181c; --result-bg: #0d0f12;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; display: flex; height: 100vh; color: var(--text); background: var(--bg); }
  nav { width: 280px; overflow-y: auto; border-right: 1px solid var(--border); background: var(--panel); padding: 12px; }
  .nav-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  nav h1 { font-size: 16px; margin: 0; }
  select { background: var(--panel); color: var(--text); border: 1px solid var(--input-border); border-radius: 4px; padding: 2px 4px; }
  .day { margin-bottom: 14px; }
  .day h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 4px; text-transform: uppercase; letter-spacing: .03em; }
  .day.today h2 { color: var(--accent); }
  .day-title { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .prob { display: flex; justify-content: space-between; padding: 4px 6px; border-radius: 4px; cursor: pointer; }
  .prob:hover { background: var(--hover); }
  .prob.active { background: var(--active); }
  .dots { white-space: nowrap; flex-shrink: 0; margin-left: 6px; }
  .dots span { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-left: 3px; background: var(--dot); }
  .dots span.ok { background: var(--ok); }
  main { flex: 1; display: flex; overflow: hidden; }
  #statement { width: 45%; overflow-y: auto; padding: 20px 24px; }
  #statement pre { background: var(--code-bg); padding: 8px 10px; border-radius: 4px; overflow-x: auto; }
  #statement code { background: var(--code-bg); padding: 1px 4px; border-radius: 3px; }
  #statement pre code { padding: 0; }
  #editor { flex: 1; display: flex; flex-direction: column; border-left: 1px solid var(--border); padding: 12px; gap: 8px; }
  .tabs button { border: 1px solid var(--input-border); background: var(--panel); color: var(--text); padding: 4px 12px; border-radius: 4px; cursor: pointer; }
  .tabs button.active { background: var(--tab-bg); color: var(--tab-fg); border-color: var(--tab-bg); }
  textarea { flex: 1; font: 13px/1.45 ui-monospace, monospace; padding: 10px; border: 1px solid var(--input-border); border-radius: 4px; resize: none; tab-size: 4; background: var(--panel); color: var(--text); }
  .actions { display: flex; gap: 8px; align-items: center; }
  .actions button { padding: 6px 16px; border: 0; border-radius: 4px; background: var(--accent); color: #fff; cursor: pointer; }
  .actions button:disabled { background: var(--disabled); }
  #hint { color: var(--muted); }
  #result { height: 30%; overflow: auto; margin: 0; padding: 10px; background: var(--result-bg); color: #eee; border-radius: 4px; font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
  #result.ok { color: #7ee787; }
  #welcome { margin: auto; text-align: center; }
  #welcome button { padding: 8px 20px; font-size: 15px; border: 0; border-radius: 4px; background: var(--accent); color: #fff; cursor: pointer; }
</style>
<script>
// Theme: "system" follows the OS setting; the choice is kept in localStorage.
const darkQuery = matchMedia("(prefers-color-scheme: dark)");
function applyTheme() {
  const choice = localStorage.theme || "system";
  const dark = choice === "dark" || (choice === "system" && darkQuery.matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
}
function setTheme(choice) {
  localStorage.theme = choice;
  applyTheme();
}
darkQuery.addEventListener("change", applyTheme);
applyTheme();
</script>
</head>
<body>
<div id="welcome" hidden>
  <h1>Coding Trainer</h1>
  <p>Weekly problem sets in C, C++, Python and Rust. A new day unlocks every day.</p>
  <button onclick="start()">Start today</button>
</div>
<nav hidden>
  <div class="nav-head">
    <h1>Coding Trainer</h1>
    <select id="theme" onchange="setTheme(this.value)" title="Theme">
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </div>
  <div id="days"></div>
</nav>
<main hidden>
  <section id="statement"></section>
  <section id="editor">
    <div class="tabs"></div>
    <textarea id="code" spellcheck="false"></textarea>
    <div class="actions">
      <button id="check" onclick="check()">Check</button>
      <button id="solution" onclick="showSolution()">Reference solution</button>
      <span id="hint"></span>
    </div>
    <pre id="result"></pre>
  </section>
</main>
<script>
const LANGS = ["c", "cpp", "py", "rs"];
const NAMES = { c: "C", cpp: "C++", py: "Python", rs: "Rust" };
let current = null, lang = "c";

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function markdown(md) {
  const parts = md.split(/```[a-z]*\n([\s\S]*?)```/);
  return parts.map((part, i) => {
    if (i % 2) return `<pre><code>${esc(part)}</code></pre>`;
    return part.trim().split(/\n\n+/).map(block => {
      let h = esc(block).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
      if (h.startsWith("# ")) return `<h2>${h.slice(2)}</h2>`;
      return `<p>${h.replace(/\n/g, "<br>")}</p>`;
    }).join("");
  }).join("");
}

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", body: JSON.stringify(body) } : {});
  return r.json();
}

async function start() { await api("/api/start", {}); load(); }

async function load() {
  const state = await api("/api/state");
  document.getElementById("welcome").hidden = state.started;
  document.querySelector("nav").hidden = !state.started;
  document.querySelector("main").hidden = !state.started;
  if (!state.started) return;
  document.getElementById("days").innerHTML = state.days.map(d => `
    <div class="day ${d.today ? "today" : ""}">
      <h2>W${d.week} · L${d.level} · Day ${d.day} · ${d.date}${d.today ? " · today" : ""}</h2>
      <div class="day-title">${d.title}</div>
      ${d.problems.map(p => `
        <div class="prob ${current && current.id === p.id ? "active" : ""}" onclick="openProblem('${p.id}')">
          <span>${p.id.toUpperCase()} ${p.name.replace(/_/g, " ")}</span>
          <span class="dots">${LANGS.map(l => `<span class="${p.passed.includes(l) ? "ok" : ""}" title="${NAMES[l]}"></span>`).join("")}</span>
        </div>`).join("")}
    </div>`).join("");
  if (!current) {
    const last = state.days[state.days.length - 1];
    openProblem(last.problems[0].id);
    document.querySelector(".day:last-child").scrollIntoView();
  }
}

async function openProblem(id) {
  current = await api("/api/problem/" + id);
  document.getElementById("statement").innerHTML = markdown(current.statement);
  document.getElementById("result").textContent = "";
  document.getElementById("solution").disabled = !current.solution;
  document.getElementById("hint").textContent = current.solution ? "" : `Solution unlocks ${current.solution_unlock}`;
  document.getElementById("code").value = "";
  selectLang(lang);
  load();
}

function selectLang(l) {
  current.code[lang] = document.getElementById("code").value || current.code[lang];
  lang = l;
  document.querySelector(".tabs").innerHTML = LANGS.map(x =>
    `<button class="${x === lang ? "active" : ""}" onclick="selectLang('${x}')">${NAMES[x]}</button>`).join(" ");
  document.getElementById("code").value = current.code[lang];
}

async function check() {
  const btn = document.getElementById("check"), out = document.getElementById("result");
  current.code[lang] = document.getElementById("code").value;
  btn.disabled = true;
  out.className = "";
  out.textContent = `Checking ${NAMES[lang]}...`;
  const r = await api("/api/check", { id: current.id, lang, code: current.code[lang] });
  out.className = r.ok ? "ok" : "";
  out.textContent = r.report;
  btn.disabled = false;
  load();
}

function showSolution() {
  const out = document.getElementById("result");
  out.className = "";
  out.textContent = "# Reference solution (Python)\n\n" + current.solution;
}

document.getElementById("code").addEventListener("keydown", e => {
  if (e.key !== "Tab") return;
  e.preventDefault();
  const t = e.target, s = t.selectionStart;
  t.value = t.value.slice(0, s) + "    " + t.value.slice(t.selectionEnd);
  t.selectionStart = t.selectionEnd = s + 4;
});

document.getElementById("theme").value = localStorage.theme || "system";
load();
</script>
</body>
</html>
